{% extends "base.html" %}
{% block title %}{{ heading }} · MediSmart{% endblock %}
{% block content %}
<div class="form-shell"><div class="form-heading"><span class="eyebrow">MEDISMART</span><h1>{{ heading }}</h1></div>
<form method="post" class="form-card">{% csrf_token %}{{ form.as_p }}<button class="btn primary full" type="submit">Save</button><a class="cancel-link" href="{% url back_url %}">Cancel</a></form></div>
{% endblock %}
